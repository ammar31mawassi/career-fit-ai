name: Staging synthetic smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: careerfit-staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Current-contract staging journey
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      SMOKE_TARGET_ENV: staging
      SMOKE_FRONTEND_URL: ${{ vars.STAGING_FRONTEND_URL }}
      SMOKE_BACKEND_URL: ${{ vars.STAGING_BACKEND_URL }}
      SMOKE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      SMOKE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SMOKE_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      SMOKE_INTERNAL_KEY: ${{ secrets.STAGING_BACKEND_API_KEY }}
      SMOKE_STORAGE_BUCKET: ${{ vars.STAGING_STORAGE_BUCKET }}
      SMOKE_EMAIL_DOMAIN: ${{ vars.STAGING_SMOKE_EMAIL_DOMAIN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install exact backend runtime
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Verify dependency closure
        run: python -m pip check
      - name: Run destructive synthetic journey with verified cleanup
        run: python backend/scripts/production_smoke.py
