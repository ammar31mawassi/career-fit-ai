name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      APP_ENV: test
      ENABLE_DEV_AUTH: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt
      - name: Verify dependency closure
        run: |
          python --version
          python -m pip check
          python -m pip inspect --local > backend-dependency-inventory.json
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q
      - name: Preserve backend dependency inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-dependency-inventory
          path: backend-dependency-inventory.json
          if-no-files-found: error
          retention-days: 30

  ocr-worker:
    name: OCR worker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: ocr-worker/requirements*.txt
      - name: Install native OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng tesseract-ocr-heb
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r ocr-worker/requirements-dev.txt
      - name: Verify dependency closure and native versions
        run: |
          python --version
          python -m pip check
          python -m pip inspect --local > ocr-dependency-inventory.json
          tesseract --version
          dpkg-query --show --showformat='${Package}=${Version}\n' tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng tesseract-ocr-heb
      - name: Run tests
        working-directory: ocr-worker
        run: python -m pytest -q
      - name: Build and smoke the OCR container
        run: |
          docker build --pull --tag careerfit-ocr:ci ocr-worker
          container=careerfit-ocr-smoke
          cleanup() {
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container" \
            --env OCR_WORKER_TOKEN=ci-synthetic-token \
            --publish 127.0.0.1:7860:7860 \
            careerfit-ocr:ci
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:7860/ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
      - name: Preserve OCR dependency inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocr-dependency-inventory
          path: ocr-dependency-inventory.json
          if-no-files-found: error
          retention-days: 30

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify JavaScript toolchain
        run: |
          test "$(node --version)" = "v22.16.0"
          test "$(npm --version)" = "10.9.2"
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run unit tests
        working-directory: frontend
        run: npm test
      - name: Type-check
        working-directory: frontend
        run: npm run typecheck
      - name: Build production application
        working-directory: frontend
        run: npm run build
      - name: Reject high-severity production advisories
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Generate frontend CycloneDX SBOM
        working-directory: frontend
        run: npm sbom --omit=dev --sbom-format=cyclonedx > frontend-sbom.cdx.json
      - name: Preserve frontend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-sbom
          path: frontend/frontend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  postgres-contract:
    name: PostgreSQL tenant-security contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - name: Pull isolated PostgreSQL image
        run: docker pull postgres:16-alpine
      - name: Verify fresh-install and upgrade contracts
        run: python supabase/tests/run_postgres_security_tests.py
