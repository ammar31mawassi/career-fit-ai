[project]
name = "career-fit-ai-api"
version = "0.1.0"
description = "FastAPI backend for Career Fit AI."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "sqlmodel>=0.0.22,<0.1",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "pypdf>=5.0,<7.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
